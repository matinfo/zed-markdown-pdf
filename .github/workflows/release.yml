name: Release Zed Extension

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install --prefix server

      - name: Run test suite
        run: node --test server/lib/__tests__/*.test.mjs

  build:
    name: Build Rust extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Build WASM
        run: cargo build --target wasm32-wasip1

  verify-server:
    name: Verify server release exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check server release exists on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep 'SERVER_RELEASE_TAG' src/lib.rs | grep -oP '"\K[^"]+' | head -1)
          echo "SERVER_RELEASE_TAG in lib.rs: $TAG"
          RETRIES=12
          DELAY=15
          for i in $(seq 1 $RETRIES); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "✅ Server release '$TAG' exists."
              exit 0
            fi
            echo "⏳ Attempt $i/$RETRIES — release '$TAG' not yet available, retrying in ${DELAY}s..."
            sleep $DELAY
          done
          echo ""
          echo "❌ Server release '$TAG' not found after $((RETRIES * DELAY))s."
          echo "Ensure the server-release workflow completed successfully for tag '$TAG'."
          exit 1

  release:
    name: Bump Zed Extension
    runs-on: ubuntu-latest
    needs: [test, build, verify-server]
    steps:
      # This step is a no-op until the initial PR to zed-industries/extensions
      # is reviewed and merged by the Zed team.
      # Once merged, remove the `if: false` line — every future v* tag will
      # then automatically open a version-bump PR via this action.
      - if: false
        uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: markdown-pdf
          push-to: matinfo/zed-extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
