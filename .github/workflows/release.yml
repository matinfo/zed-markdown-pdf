name: Release Zed Extension

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install --prefix server

      - name: Run test suite
        run: node --test server/lib/__tests__/*.test.mjs

  build:
    name: Build Rust extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Build WASM
        run: cargo build --target wasm32-wasip1

  verify-server:
    name: Verify server release exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check server release exists on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep 'SERVER_RELEASE_TAG' src/lib.rs | grep -oP '"\K[^"]+' | head -1)
          echo "SERVER_RELEASE_TAG in lib.rs: $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "✅ Server release '$TAG' exists."
          else
            echo ""
            echo "❌ Server release '$TAG' not found on GitHub."
            echo "Push the '$TAG' tag first to trigger the server-release workflow."
            exit 1
          fi

  release:
    name: Bump Zed Extension
    runs-on: ubuntu-latest
    needs: [test, build, verify-server]
    steps:
      - uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: markdown-pdf
          push-to: matinfo/zed-extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
