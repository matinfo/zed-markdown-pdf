name: Release Server

on:
  push:
    tags:
      - "server-v*"

jobs:
  package-and-release:
    name: Package & publish server archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify SERVER_RELEASE_TAG matches pushed tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED=$(grep 'SERVER_RELEASE_TAG' src/lib.rs | grep -oP '"\K[^"]+' | head -1)
          echo "Pushed tag   : $TAG"
          echo "lib.rs tag   : $EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo ""
            echo "❌ Mismatch — update SERVER_RELEASE_TAG in src/lib.rs to \"$TAG\" before pushing this tag."
            exit 1
          fi
          echo "✅ Tag matches SERVER_RELEASE_TAG in src/lib.rs"

      - name: Package server archive
        run: |
          cd server
          tar -czf ../markdown-pdf-server.tar.gz \
            markdown_pdf_server.mjs \
            default.css \
            package.json \
            lib/
          echo "Archive contents:"
          tar -tzf ../markdown-pdf-server.tar.gz

      - name: Create GitHub release and upload archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Server ${{ github.ref_name }}"
          body: |
            MCP server bundle for the **Markdown PDF** Zed extension.

            This archive is downloaded automatically by the extension on first use — no manual action required.

            ### Contents
            | File | Description |
            |------|-------------|
            | `markdown_pdf_server.mjs` | MCP server entry point |
            | `default.css` | Built-in neutral stylesheet |
            | `package.json` | npm manifest (markdown-it, highlight.js, …) |
            | `lib/` | Server library modules |
          files: markdown-pdf-server.tar.gz
          fail_on_unmatched_files: true
