id = "markdown-pdf"
name = "Markdown PDF"
version = "0.1.0"
schema_version = 1
authors = ["Mat <mat@matinfo.ch>"]
description = "PDF Markdown export for Zed through an MCP server powered by Playwright"
repository = "https://github.com/matinfo/zed-markdown-pdf"

[context_servers.markdown-pdf]

[slash_commands.export-pdf]
description = "Export a Markdown file to PDF"
requires_argument = false

[slash_commands.export-pdf-with-headers]
description = "Export a Markdown file to PDF with header and footer"
requires_argument = false
